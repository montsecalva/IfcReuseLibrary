<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFC-Modell hochladen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #2d3748;
            min-width: 150px;
            z-index: 1;
        }

        .dropdown:hover .dropdown-content {
            display: none; /* Deshabilitar hover */
        }

        .dropdown.active .dropdown-content {
            display: block;
        }
    </style>
    <script>
        function toggleDropdown(event) {
            event.stopPropagation();
            const dropdown = document.querySelector('.dropdown');
            dropdown.classList.toggle('active');
        }

        document.addEventListener('click', () => {
            const dropdown = document.querySelector('.dropdown');
            dropdown.classList.remove('active');
        });
    </script>
</head>
<body class="bg-gray-900 text-[#F1FAEE]">

    <header class="bg-gray-800 shadow-md py-4 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-4">
            <img src="/Users/montserratcalvaalatorre/Desktop/ifcpagedesign/logo.pdf" alt="Logo" class="h-10">
            <nav class="flex space-x-4 ml-4">
                <a href="index.html" class="text-[#F1FAEE] hover:text-[#4CAF50]">Home</a>
                <a href="catalog.html" class="text-[#F1FAEE] hover:text-[#4CAF50]">Katalog</a>
                <a href="upload.html" class="text-[#F1FAEE] hover:text-[#4CAF50]">Upload</a>
                <a href="api.html" class="text-[#F1FAEE] hover:text-[#4CAF50]">API</a>
                <a href="about.html" class="text-[#F1FAEE] hover:text-[#4CAF50]">Über Uns</a>
            </nav>
        </div>
        <div class="dropdown relative">
            <button onclick="toggleDropdown(event)" class="text-[#F1FAEE] hover:text-[#4CAF50]">👤 Benutzer</button>
            <div class="dropdown-content bg-gray-700 rounded shadow-lg">
                <a href="#" class="block px-4 py-2 hover:bg-gray-600">Einstellungen</a>
                <a href="#" class="block px-4 py-2 hover:bg-gray-600">Profil</a>
                <a href="#" class="block px-4 py-2 hover:bg-gray-600">Abmelden</a>
            </div>
        </div>
    </header>

    <section class="max-w-lg mx-auto mt-12 bg-gray-800 p-6 rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold text-[#F1FAEE] text-center">IFC-Modell hochladen</h2>
        <p class="text-gray-400 text-center">Lade deine IFC-Datei hoch, um wiederverwendbare Bauteile zu extrahieren.</p>
        
        <form class="mt-4">
            <label class="block text-[#F1FAEE] font-semibold">Projektname:</label>
            <input type="text" class="w-full border border-gray-600 bg-gray-700 text-[#F1FAEE] p-2 rounded mt-1" placeholder="Projektname eingeben">

            <label class="block text-[#F1FAEE] font-semibold mt-4">IFC-Datei hochladen:</label>
            <input type="file" class="w-full border border-gray-600 bg-gray-700 text-[#F1FAEE] p-2 rounded mt-1">

            <button type="submit" class="w-full mt-4 bg-[#4CAF50] text-white py-2 rounded">📤 Hochladen</button>
        </form>
    </section>

</body>
</html>
